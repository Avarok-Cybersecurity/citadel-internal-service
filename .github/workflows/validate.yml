name: Validate PR
on:
  workflow_call:
  pull_request:
  # `master` was validated by NOTHING.
  #
  # There was no `push:` trigger, and the `workflow_call` above has no caller:
  # the only `uses: ./.github/workflows/validate.yml` anywhere is the PARENT
  # invoking its OWN workflow, since `./` is repo-relative. So two PRs could
  # each pass alone, conflict once merged, and leave master broken with nothing
  # running to say so -- until the parent bumped its submodule pointer and the
  # failure landed on the bumper rather than on the change that caused it. This
  # file already documents that misattribution for the websockets feature flag;
  # it applied to the trigger itself.
  push:
    branches: [master]

concurrency:
  group: ${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: full
  # 40 MiB stack
  RUST_MIN_STACK: 40971520
  RUST_LOG: "citadel=trace"

jobs:
  tests:
    strategy:
      matrix:
        os: [ ubuntu-latest, macos-latest, windows-latest ]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    steps:
      - uses: Avarok-Cybersecurity/gh-actions-deps@master
      - uses: taiki-e/install-action@nextest
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: "ci-${{ matrix.os }}"
      # `websockets` is not a default feature, and the origin-policy and
      # handshake tests are behind `#[cfg(feature = "websockets")]`. Without it
      # they are not skipped -- they are not COMPILED, so the run is green with
      # 11 tests instead of 27, and the 16 missing ones are the entire test
      # suite for the agent's loopback boundary: which browser origins may open
      # a control connection to it.
      #
      # Production ships the feature (citadel-workspace-internal-service depends
      # on this crate with features = ["websockets"]), so CI was testing a
      # configuration nobody runs and skipping the security-relevant half.
      #
      # This is a REGRESSION. docs/ROBUSTNESS.md round 564 records exactly this,
      # and the fix -- "6 passed" becoming "33 passed". The flag was lost again.
      # The parent's check-feature-gated-tests-are-compiled.mjs fails if this
      # flag goes missing. Note where that gate LIVES: this repository's CI does
      # not run it, so dropping the flag here stays green until someone bumps
      # the parent's submodule pointer, and the failure lands on the bumper
      # rather than on the change that caused it.
      - run: cargo nextest run --features=vendored,websockets
        if: startsWith(matrix.os, 'windows')
      - run: cargo nextest run --features=websockets
        if: ${{ !startsWith(matrix.os, 'windows') }}

  clippy:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: Avarok-Cybersecurity/gh-actions-deps@master
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: "ci-clippy"
      - run: rustup component add clippy-preview
      # `--features websockets`, matching the test job above. Without it clippy
      # compiles 11 tests where the feature compiles 27, so the origin-policy
      # and handshake modules -- the agent's loopback boundary -- were never
      # linted under `-D warnings` at all. Compiling tests is compiling tests,
      # whichever command does it.
      - run: cargo clippy --tests --features websockets -- -D warnings

  fmt:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: Avarok-Cybersecurity/gh-actions-deps@master
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - run: cargo fmt --check

  typescript-integration:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Verify TypeScript types exist
        run: |
          # Types are committed to the repo - verify they exist
          test -f typescript-client/src/types/index.ts || exit 1
          test -f typescript-client/src/types/InternalServiceRequest.ts || exit 1
          test -f typescript-client/src/types/InternalServiceResponse.ts || exit 1
          echo "TypeScript types verified"
      - name: Run integration tests via Docker Compose
        run: |
          cd ci
          docker compose -f docker-compose.test.yml up --build --abort-on-container-exit --exit-code-from typescript-tests
      - name: Cleanup Docker resources
        if: always()
        run: |
          cd ci
          docker compose -f docker-compose.test.yml down -v --remove-orphans